<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fd8ff"/>
      <stop offset="48%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#a97dff"/>
    </linearGradient>
  </defs>

  <!--
    不使用 mask：部分渲染器（含 iOS 图标管线）会把 mask 内的白色矩形
    当成实色背景绘制。这里改为 fill-rule="evenodd" 的真实镂空路径，
    背景完全透明，任何环境下都不会出现底色。
  -->
  <g transform="translate(512 512) scale(0.82) translate(-512 -512)">
    <!-- 视频主体：圆角矩形 + 右侧梯形，中间三条竖线用 evenodd 挖空 -->
    <path fill="url(#fg)" fill-rule="evenodd" d="
      M320 330
      L532 330
      A84 84 0 0 1 616 414
      L616 602
      A84 84 0 0 1 532 686
      L320 686
      A84 84 0 0 1 236 602
      L236 414
      A84 84 0 0 1 320 330
      Z
      M352 475 A17 17 0 0 1 369 458
      A17 17 0 0 1 386 475
      L386 549
      A17 17 0 0 1 369 566
      A17 17 0 0 1 352 549
      Z
      M409 449 A17 17 0 0 1 426 432
      A17 17 0 0 1 443 449
      L443 575
      A17 17 0 0 1 426 592
      A17 17 0 0 1 409 575
      Z
      M466 475 A17 17 0 0 1 483 458
      A17 17 0 0 1 500 475
      L500 549
      A17 17 0 0 1 483 566
      A17 17 0 0 1 466 549
      Z
    "/>

    <!-- 右侧镜头梯形 -->
    <path fill="url(#fg)" d="
      M656 424 L790 360 Q820 346 820 380
      L820 636 Q820 670 790 656 L656 592 Z
    "/>
  </g>
</svg>
