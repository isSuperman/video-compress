<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<title>MC作业专用</title>

<!-- 图标：Safari 优先用 SVG（透明背景，任意尺寸清晰） -->
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="mask-icon" href="./favicon.svg" color="#4f7cff">

<!-- 编码库按需加载：预热连接 + 空闲时提前下载，两者都不阻塞首屏 -->
<link rel="preconnect" href="https://video-compress-8uy.pages.dev" crossorigin>
<link rel="prefetch" href="./lib/mediabunny.bundle.js" as="script">

<!-- 液态玻璃：库文件在本站 lib/ 下，页面 load 后才注入（见 JS 里的 loadGlass） -->

<!-- 液态玻璃：库文件在本站 lib/ 下，页面 load 后才注入（见 JS 里的 loadGlass） -->

<!-- 液态玻璃：库文件在本站 lib/ 下，页面 load 后才注入（见 JS 里的 loadGlass） -->


<!-- 添加到主屏幕：以独立应用方式启动，全屏无 Safari 界面 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MC作业">
<meta name="application-name" content="MC作业">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="./assets/style.68baf272bf.css">
<script>
/* 主题：在首帧前把上次选的主题写上，避免闪烁。
   没存过就跟随系统（不写 data-theme）。默认深色，和页面原本的版式一致。 */
(function () {
  try {
    var t = localStorage.getItem('vmc-theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<script id="theme-boot">
/* 主题三态：跟随系统 / 手动深色 / 手动浅色。
   在首个样式表之前执行，把实际主题写到 data-applied，避免首帧闪一下。 */
(function () {
  var d = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem('vmc-theme'); } catch (e) {}
  var sysLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  var theme = (saved === 'light' || saved === 'dark') ? saved : (sysLight ? 'light' : 'dark');
  d.setAttribute('data-applied', theme);
  d.setAttribute('data-theme', theme);   /* 玻璃层读这个 */
})();
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fd8ff"/>
      <stop offset="55%" stop-color="#6f8cff"/>
      <stop offset="100%" stop-color="#c39bff"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <div class="eyebrow">WebCodecs · Local</div>
  <h1>MC作业专用</h1>
  <div class="sub">本地硬件编码，文件不会上传到任何服务器</div>
</header>

<button class="lgThemeBtn" id="lgThemeBtn" type="button" aria-label="切换深色/浅色" hidden>
  <svg class="iMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  <svg class="iSun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
</button>

<!-- 选择视频：原交互区保留（点击/拖拽/无障碍），玻璃垫在它后面 -->
<div class="dropWrap">
  <div class="lgHost" data-lg="drop"></div>
  <div class="drop" id="drop">
  <div class="ring">
    <svg viewBox="0 0 24 24">
      <rect x="2.5" y="6" width="13" height="12" rx="2.6"/>
      <path d="M15.5 11.2l5-2.9v7.4l-5-2.9z"/>
    </svg>
  </div>
  <div class="t">选择视频</div>
  <div class="hint">或把文件拖进来 · MP4 / MOV / WebM</div>
  <input type="file" id="file" accept="video/*">
  </div>
</div>

<div class="card hide" id="infoCard">
  <div class="label">源文件</div>
  <div class="meta" id="meta"></div>
  <div class="note" id="srcWarn"></div>

  <div class="divider"></div>

  <div class="lgRowHead lgBlock"><span class="k">分辨率</span><span class="v" id="lgResVal">1080p</span></div>
  <!-- 液态玻璃按钮组：库不可用时（html 上没有 .lg-on）自动退回下面的 HTML 胶囊 -->
  <div class="lgHost lgBlock" data-lg="res" data-lg-control="1"></div>
  <div class="optRow lgReplaced" id="resRow">
    <span class="optKey">分辨率</span>
    <div class="chips" id="resOpts">
      <button class="chip on" data-res="1080">1080p</button>
      <button class="chip" data-res="720">720p</button>
      <button class="chip" data-res="480">480p</button>
    </div>
  </div>

  <div class="lgRowHead lgBlock"><span class="k">画质</span><span class="v" id="lgQVal">4 Mbps</span></div>
  <div class="lgHost lgBlock" data-lg="q" data-lg-control="1"></div>
  <div class="optRow lgReplaced">
    <span class="optKey">画质</span>
    <div class="slideWrap">
      <input type="range" id="qRange" min="0" max="2" step="1" value="1"
             aria-label="画质档位">
      <div class="slideMarks">
        <span>小</span><span>标准</span><span>高</span>
      </div>
    </div>
    <span class="qVal" id="qVal">4 Mbps</span>
  </div>

  <div class="note" id="codecWarn"></div>

  <!-- 压缩按钮 + 进度：同一个容器内，进度沿按钮底边推进 -->
  <div class="lgHost" data-lg="start"></div>
  <div class="actBtn" id="start" role="button" tabindex="0">
    <div class="actFill" id="bar"></div>
    <div class="actRow">
      <span class="actLabel" id="actLabel">开始压缩</span>
      <span class="actPct" id="actPct"></span>
    </div>
  </div>
  <div class="hide" id="status"></div>
</div>

<div class="card hide" id="resultCard">
  <div class="label">压缩完成</div>
  <div class="resTop">
    <span class="saveTag" id="saveTag">已压缩</span>
    <span class="resTime" id="rTime"></span>
  </div>
  <div class="row">
    <div><b id="rOrig">—</b>原始</div>
    <div class="new"><b id="rNew">—</b>压缩后</div>
    <div><b id="rSave">—</b>节省</div>
  </div>
  <div class="spec" id="result"></div>
  <button class="primary" id="download" style="margin-top:14px">保存到相册</button>
  <div class="save" id="saveHint"></div>
  <button class="linkBtn" id="again">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 12a8 8 0 1 0 2.4-5.7"/>
      <path d="M4 5v4.5h4.5"/>
    </svg>
    处理另一个视频
  </button>
</div>

<footer>
  基于 <b>mediabunny</b> + <b>WebCodecs</b><br>
  需要 iOS 16.4+ / Chrome 94+ 等支持 WebCodecs 的浏览器

  <div class="sign">
    <span class="signLine"></span>
    <span class="signText">Crafted with <span class="heart">♥</span> by <b>MC'dady</b></span>
    <span class="signLine"></span>
  </div>

  <div class="ver" id="verLine">
    <span class="verDot" id="verDot"></span>
    <span id="verText">检查版本中…</span>
  </div>
</footer>

<script type="module" src="./assets/app.5f1f2f01e8.js"></script>
</body>
</html>
