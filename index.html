<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="color-scheme" content="dark">
<title>视频压缩 · 本地硬件编码</title>
<style>
  :root{
    --bg:#05060a;
    --text:#f2f4f8;
    --dim:#8a90a3;
    --dimmer:#5b6072;
    --line:rgba(255,255,255,.09);
    --line-hi:rgba(140,200,255,.32);
    --cyan:#3fd8ff;
    --blue:#4f7cff;
    --violet:#9d6bff;
    --ok:#2ee6a8;
    --warn:#ffb340;
    --err:#ff5470;
    --glass:rgba(255,255,255,.045);
    --glass-2:rgba(255,255,255,.07);
    --r-lg:22px;
    --r-md:16px;
    --r-sm:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0 auto;max-width:600px;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom));
    background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",sans-serif;
    letter-spacing:.005em;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;position:relative;min-height:100vh;
  }
  /* ── 背景光晕 ── */
  body::before{
    content:"";position:fixed;inset:-20% -20% auto -20%;height:80vh;z-index:-2;
    background:
      radial-gradient(48% 42% at 22% 8%, rgba(63,216,255,.20), transparent 68%),
      radial-gradient(46% 40% at 84% 16%, rgba(157,107,255,.18), transparent 66%),
      radial-gradient(60% 44% at 50% 46%, rgba(79,124,255,.11), transparent 70%);
    filter:blur(8px);pointer-events:none;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(72% 58% at 50% 24%, #000 0%, transparent 82%);
    -webkit-mask-image:radial-gradient(72% 58% at 50% 24%, #000 0%, transparent 82%);
  }

  /* ── 标题 ── */
  header{margin-bottom:22px;padding:2px 2px 0}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cyan);opacity:.9;margin-bottom:9px;
  }
  .eyebrow::before{
    content:"";width:5px;height:5px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px 2px rgba(63,216,255,.7);
  }
  h1{
    font-size:30px;line-height:1.14;margin:0 0 8px;font-weight:700;letter-spacing:-.028em;
    background:linear-gradient(100deg,#ffffff 0%,#d9ecff 26%,#7ec8ff 56%,#a98bff 84%,#e0b0ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 22px rgba(90,160,255,.3));
  }
  .sub{color:var(--dim);font-size:13px;line-height:1.6}

  /* ── 玻璃卡片 ── */
  .card{
    position:relative;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    padding:17px;
    margin-bottom:13px;
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.07) inset,
      0 -1px 0 rgba(0,0,0,.22) inset,
      0 12px 34px -20px rgba(0,0,0,.95);
  }
  /* 说明：本页刻意不使用入场动画与 backdrop-filter 动画组合。
     iOS WebView 在页面不可见/无合成时 transition 会停在初始帧，
     导致卡片永久透明。玻璃质感改为静态实现。 */

  /* ── 拖放区 ── */
  .drop{
    position:relative;overflow:hidden;
    border:1.5px dashed rgba(255,255,255,.14);
    border-radius:var(--r-lg);
    padding:34px 18px 30px;
    text-align:center;cursor:pointer;
    background:linear-gradient(168deg,rgba(63,216,255,.075),rgba(157,107,255,.055) 58%,rgba(255,255,255,.022));
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 16px 40px -24px rgba(0,0,0,.9);
    transition:transform .18s cubic-bezier(.22,.9,.28,1), border-color .2s, box-shadow .2s;
    margin-bottom:13px;
  }
  .drop::after{
    content:"";position:absolute;top:-60%;left:-30%;width:60%;height:220%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.07),transparent);
    transform:rotate(14deg);pointer-events:none;
  }
  .drop:active{transform:scale(.982)}
  .drop.over{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(63,216,255,.4),0 0 46px -8px rgba(63,216,255,.5) inset}
  .drop .ring{
    width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.16),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 0 26px -6px rgba(63,216,255,.55), 0 1px 0 rgba(255,255,255,.16) inset;
  }
  .drop .ring svg{width:27px;height:27px;stroke:url(#g1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .drop .t{font-size:16.5px;font-weight:620;letter-spacing:-.01em}
  .drop .hint{color:var(--dim);font-size:12.5px;margin-top:5px}
  input[type=file]{display:none}

  /* ── 标签 ── */
  .label{
    font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;
    margin-bottom:11px;font-weight:650;display:flex;align-items:center;gap:8px;
  }
  .label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* ── 分段控件 ── */
  .seg{
    display:flex;gap:4px;padding:4px;border-radius:var(--r-md);
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.055);
    box-shadow:0 1px 0 rgba(255,255,255,.045) inset;
    margin-bottom:16px;
  }
  .seg:last-of-type{margin-bottom:0}
  .opt{
    flex:1;padding:10px 4px;border:0;border-radius:12px;background:transparent;
    color:var(--dim);font:inherit;font-size:13px;font-weight:550;cursor:pointer;
    text-align:center;transition:.2s cubic-bezier(.22,.9,.28,1);position:relative;
  }
  .opt small{display:block;font-size:10.5px;opacity:.68;margin-top:2px;font-weight:400;letter-spacing:.01em}
  .opt.on{
    color:#fff;font-weight:650;
    background:linear-gradient(178deg,rgba(79,124,255,.92),rgba(120,92,255,.86));
    box-shadow:
      0 1px 0 rgba(255,255,255,.28) inset,
      0 6px 18px -8px rgba(79,124,255,.95),
      0 0 0 1px rgba(140,170,255,.4);
  }
  .opt.on small{opacity:.85}

  /* ── 元信息 ── */
  .meta{font-size:13px;color:var(--dim);line-height:1.8;word-break:break-word}
  .meta b{color:var(--text);font-weight:600}

  /* ── 主按钮 ── */
  button.primary{
    position:relative;overflow:hidden;
    width:100%;padding:15px;border:0;border-radius:var(--r-md);
    background:linear-gradient(96deg,#2fb8ff,#4f7cff 46%,#8f5cff);
    color:#fff;font:inherit;font-size:16px;font-weight:650;letter-spacing:.01em;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,.3) inset,
      0 10px 28px -12px rgba(79,124,255,.9),
      0 0 0 .5px rgba(120,150,255,.5);
    transition:transform .15s, filter .2s, opacity .2s;
  }
  button.primary::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.26) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .6s ease;
  }
  button.primary:active{transform:scale(.982)}
  button.primary:active::after{transform:translateX(120%)}
  button.primary:disabled{
    background:rgba(255,255,255,.055);color:var(--dimmer);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
    cursor:default;
  }
  button.primary:disabled::after{display:none}

  button.ghost{
    width:100%;padding:13px;margin-top:9px;
    border:1px solid var(--line);border-radius:var(--r-md);
    background:rgba(255,255,255,.035);color:var(--text);
    font:inherit;font-size:14.5px;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:.16s;
  }
  button.ghost:active{background:rgba(255,255,255,.08)}

  /* ── 进度 ── */
  .bar{
    height:5px;border-radius:99px;overflow:hidden;margin:14px 0 10px;
    background:rgba(255,255,255,.075);
    box-shadow:0 1px 2px rgba(0,0,0,.4) inset;
  }
  .bar>i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--cyan),var(--blue) 55%,var(--violet));
    box-shadow:0 0 14px 0 rgba(79,124,255,.85);
    transition:width .2s cubic-bezier(.3,.9,.3,1);
  }
  .status{font-size:12.5px;color:var(--dim);text-align:center;min-height:19px;font-variant-numeric:tabular-nums}

  /* ── 结果：紧凑布局 ── */
  .resTop{display:flex;gap:13px;align-items:center}
  .thumb{
    flex:0 0 92px;width:92px;height:92px;border-radius:14px;
    overflow:hidden;position:relative;
    background:linear-gradient(150deg,rgba(63,216,255,.14),rgba(157,107,255,.1));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 8px 22px -12px #000;
    cursor:pointer;
  }
  .thumb video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  .thumb .play{
    position:absolute;inset:0;display:grid;place-items:center;
    background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 60%);pointer-events:none;
  }
  .thumb .play i{
    width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .thumb .play i::after{
    content:"";border-left:8px solid #fff;border-top:5.5px solid transparent;
    border-bottom:5.5px solid transparent;margin-left:2.5px;
  }
  .resStats{flex:1;min-width:0}
  .resStats .saveTag{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;letter-spacing:.06em;
    color:#052018;background:linear-gradient(96deg,#2ee6a8,#3fd8ff);
    padding:2.5px 9px;border-radius:99px;margin-bottom:7px;
  }
  .resStats .row{display:flex;gap:16px;margin-top:2px}
  .resStats .row>div{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
  .resStats .row b{
    display:block;font-size:17px;font-weight:680;color:var(--text);
    letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin-bottom:1px;
  }
  .resStats .row .new b{color:var(--ok)}
  .spec{
    font-size:11.5px;color:var(--dim);line-height:1.65;margin-top:11px;
    padding-top:11px;border-top:1px solid rgba(255,255,255,.065);
  }

  .note{font-size:12.5px;color:var(--warn);margin-top:11px;line-height:1.6}
  .note:empty{display:none}
  .save{font-size:11.5px;color:var(--dimmer);text-align:center;margin-top:9px;line-height:1.6}
  .save:empty{display:none}
  .hide{display:none!important}

  footer{
    text-align:center;font-size:11px;color:var(--dimmer);
    margin-top:30px;line-height:1.85;letter-spacing:.02em;
  }
  footer b{color:var(--dim);font-weight:600}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fd8ff"/>
      <stop offset="55%" stop-color="#6f8cff"/>
      <stop offset="100%" stop-color="#c39bff"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <div class="eyebrow">WebCodecs · Local</div>
  <h1>视频压缩</h1>
  <div class="sub">本地硬件编码，文件不会上传到任何服务器</div>
</header>

<div class="drop" id="drop">
  <div class="ring">
    <svg viewBox="0 0 24 24">
      <rect x="2.5" y="6" width="13" height="12" rx="2.6"/>
      <path d="M15.5 11.2l5-2.9v7.4l-5-2.9z"/>
    </svg>
  </div>
  <div class="t">选择视频</div>
  <div class="hint">或把文件拖进来 · MP4 / MOV / WebM</div>
  <input type="file" id="file" accept="video/*">
</div>

<div class="card hide" id="infoCard">
  <div class="label">源文件</div>
  <div class="meta" id="meta"></div>
  <div class="note" id="srcWarn"></div>
</div>

<div class="card hide" id="optCard">
  <div class="label">输出分辨率</div>
  <div class="seg" id="resOpts">
    <button class="opt on" data-res="1080">1080p<small>原画质</small></button>
    <button class="opt" data-res="720">720p<small>省流量</small></button>
    <button class="opt" data-res="480">480p<small>更小</small></button>
  </div>
  <div class="label">画质档位</div>
  <div class="seg" id="qOpts">
    <button class="opt" data-q="8">高<small>8 Mbps</small></button>
    <button class="opt on" data-q="4">标准<small>4 Mbps</small></button>
    <button class="opt" data-q="2">小<small>2 Mbps</small></button>
  </div>
  <div class="note" id="codecWarn"></div>
</div>

<div class="card hide" id="runCard">
  <button class="primary" id="start">开始压缩</button>
  <div class="hide" id="barWrap">
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="card hide" id="resultCard">
  <div class="label">压缩完成</div>
  <div class="resTop">
    <div class="thumb" id="thumb">
      <video id="preview" playsinline muted preload="metadata"></video>
      <div class="play"><i></i></div>
    </div>
    <div class="resStats">
      <div class="saveTag" id="saveTag">已压缩</div>
      <div class="row">
        <div><b id="rOrig">—</b>原始</div>
        <div class="new"><b id="rNew">—</b>压缩后</div>
        <div><b id="rSave">—</b>节省</div>
      </div>
    </div>
  </div>
  <div class="spec" id="result"></div>
  <button class="primary" id="download" style="margin-top:14px">保存视频</button>
  <div class="save" id="saveHint"></div>
  <button class="ghost" id="again">处理另一个视频</button>
</div>

<footer>
  基于 <b>mediabunny</b> + <b>WebCodecs</b><br>
  需要 iOS 16.4+ / Chrome 94+ 等支持 WebCodecs 的浏览器
</footer>

<script src="./lib/mediabunny.bundle.js"></script>
<script>
const mb = window.Mediabunny;
const $ = id => document.getElementById(id);

let srcFile = null, srcInfo = null, lastBlob = null, lastName = '';
let selRes = 1080, selQ = 4;

/* ---------- 卡片显示 ---------- */
// 不使用 opacity 过渡（见 CSS 注释），直接切换显隐，保证任何环境下都可见。
function showCard(id){
  const el = $(id);
  el.classList.remove('hide');
  el.classList.remove('enter');
}
function hideCard(id){
  $(id).classList.add('hide');
}
// 进度区不是 .card，单独显隐
function barWrapShow(){
  $('barWrap').classList.remove('hide');
}

/* ---------- 环境检测 ---------- */
const HAS_WC = typeof VideoEncoder !== 'undefined' && typeof VideoDecoder !== 'undefined';

/* ---------- 文件选择 ---------- */
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
});

function fmtTime(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function mbStr(bytes) {
  return (bytes/1048576).toFixed(bytes > 10485760 ? 1 : 2) + ' MB';
}

async function loadFile(f) {
  srcFile = f;
  lastBlob = null;
  hideCard('resultCard');
  showCard('runCard');
  $('barWrap').classList.add('hide');
  $('status').textContent = '';
  $('status').className = 'status';
  $('srcWarn').textContent = '';
  $('codecWarn').textContent = '';
  $('start').disabled = true;

  if (!HAS_WC) {
    $('meta').textContent = '';
    showCard('infoCard');
    $('srcWarn').textContent =
      '当前浏览器不支持 WebCodecs，无法进行硬件编码。请使用 Safari（iOS 16.4+）或其他新版浏览器打开。';
    return;
  }

  try {
    const input = new mb.Input({
      formats: mb.ALL_FORMATS,
      source: new mb.BlobSource(f)
    });
    const vTrack = await input.getPrimaryVideoTrack();
    const aTrack = await input.getPrimaryAudioTrack();

    if (!vTrack) throw new Error('文件中没有找到视频轨道');

    srcInfo = {
      input, vTrack, aTrack,
      width: vTrack.displayWidth || vTrack.codedWidth,
      height: vTrack.displayHeight || vTrack.codedHeight,
      duration: await input.computeDuration(),
      hasAudio: !!aTrack,
      codec: vTrack.codec
    };

    // mediabunny 的 displayWidth / displayHeight 已经应用了旋转矩阵
    // （例如 iPhone 竖屏视频：coded 1920×1080 + rotation 90 → display 1080×1920），
    // 所以直接用 display 尺寸，不需要自己再对调，否则方向反而会错。
    srcInfo.displayW = srcInfo.width;
    srcInfo.displayH = srcInfo.height;

    $('meta').innerHTML =
      `<b>${f.name}</b><br>` +
      `${srcInfo.displayW} × ${srcInfo.displayH} · ${fmtTime(srcInfo.duration)} · ${mbStr(f.size)}<br>` +
      `编码 <b>${String(srcInfo.codec || '未知').toUpperCase()}</b>` +
      (srcInfo.hasAudio ? ' · 含音轨' : ' · <b>无音轨</b>');

    showCard('infoCard');
    showCard('optCard');

    if (!srcInfo.hasAudio) {
      $('srcWarn').textContent = '该视频没有音轨，压缩后的文件也不会有声音。';
    }

    // 预检：确认源编码可解码
    const testOutput = new mb.Output({
      format: new mb.Mp4OutputFormat(),
      target: new mb.BufferTarget()
    });
    const probe = await mb.Conversion.init({
      input, output: testOutput,
      video: { codec: 'avc', bitrate: 2500000 },
      audio: srcInfo.hasAudio
        ? { codec: 'aac', bitrate: 128000 }
        : { discard: true }
    });
    const dropped = (probe.discardedTracks || [])
      .filter(t => t.reason !== 'discarded_by_user');
    if (!probe.isValid || dropped.length) {
      const why = dropped.map(t => t.reason).join(', ') || '配置无效';
      $('srcWarn').textContent =
        `此视频的编码（${String(srcInfo.codec).toUpperCase()}）无法被浏览器直接解码（${why}）。` +
        `请换用手机原始拍摄的视频，或先用其他工具转成 H.264 / HEVC 再试。`;
      return;
    }

    $('start').disabled = false;
  } catch (e) {
    console.error(e);
    $('meta').textContent = '';
    showCard('infoCard');
    $('srcWarn').textContent = '读取失败：' + e.message;
  }
}

/* ---------- 选项 ---------- */
$('resOpts').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  [...$('resOpts').children].forEach(x => x.classList.remove('on'));
  b.classList.add('on'); selRes = +b.dataset.res;
});
$('qOpts').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  [...$('qOpts').children].forEach(x => x.classList.remove('on'));
  b.classList.add('on'); selQ = +b.dataset.q;
});

/* ---------- 计算目标尺寸 ---------- */
// displayW/H 已带旋转（竖屏是 1080×1920），但 mediabunny 的 width/height 参数
// 作用于 coded 尺寸，所以这里按 coded 尺寸比例缩放，再按显示方向返回。
function targetSize(w, h, maxDim) {
  const longSide = Math.max(w, h);
  const scale = Math.min(1, maxDim / longSide);
  return [
    Math.max(2, Math.round(w * scale / 2) * 2),
    Math.max(2, Math.round(h * scale / 2) * 2)
  ];
}

/* ---------- 缩略图点击：全屏预览 ---------- */
$('thumb').addEventListener('click', () => {
  const v = $('preview');
  if (!lastBlob) return;
  if (v.requestFullscreen) v.requestFullscreen().catch(() => {});
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
});

/* ---------- 开始压缩 ---------- */
$('start').addEventListener('click', async () => {
  if (!srcFile || !srcInfo) return;

  const btn = $('start');
  btn.disabled = true;
  barWrapShow();
  $('bar').style.width = '0%';
  $('status').className = 'status';
  $('status').textContent = '准备中…';

  try {
    // 缩放基准用「短边」判断清晰度档位：1080p 指短边 1080。
    // 竖屏 1080×1920 与横屏 1920×1080 都应落在 1080p 档，不被缩小。
    const shortSide = Math.min(srcInfo.displayW, srcInfo.displayH);
    const scale = Math.min(1, selRes / shortSide);
    const tw = Math.max(2, Math.round(srcInfo.displayW * scale / 2) * 2);
    const th = Math.max(2, Math.round(srcInfo.displayH * scale / 2) * 2);

    // 码率按实际像素数缩放（以 1080p 为基准）
    const ratio = Math.max(0.3, (tw * th) / (1920 * 1080));
    const bitrate = Math.round(selQ * 1e6 * ratio);

    const output = new mb.Output({
      format: new mb.Mp4OutputFormat(),
      target: new mb.BufferTarget()
    });

    const conversion = await mb.Conversion.init({
      input: srcInfo.input,
      output,
      video: {
        width: tw, height: th,
        fit: 'contain',
        codec: 'avc',
        bitrate,
        keyFrameInterval: 2,
        // 关键：allowRotationMetadata 让 mediabunny 用旋转标记表达方向，
        // 而不是把像素转置。否则竖屏视频会被压成横屏或尺寸错乱。
        allowRotationMetadata: true,
        hardwareAcceleration: 'prefer-hardware'
      },
      audio: srcInfo.hasAudio
        ? { codec: 'aac', bitrate: 128000, numberOfChannels: 2, sampleRate: 48000 }
        : { discard: true }
    });

    if (!conversion.isValid) {
      const why = (conversion.discardedTracks || []).map(t => t.reason).join(', ');
      throw new Error('无法配置此转换：' + (why || '未知原因'));
    }

    conversion.onProgress = p => {
      const pct = Math.min(100, Math.round(p * 100));
      $('bar').style.width = pct + '%';
      $('status').textContent = `压缩中… ${pct}%`;
    };

    const t0 = performance.now();
    await conversion.execute();
    const elapsed = (performance.now() - t0) / 1000;

    const buf = output.target.buffer;
    if (!buf || !buf.byteLength) throw new Error('输出为空，编码可能失败');

    lastBlob = new Blob([buf], { type: 'video/mp4' });
    lastName = srcFile.name.replace(/\.[^.]+$/, '') + '_compressed.mp4';

    const saved = Math.round((1 - lastBlob.size / srcFile.size) * 100);

    $('bar').style.width = '100%';
    $('status').className = 'status';
    $('status').textContent = `完成 · 用时 ${elapsed.toFixed(1)} 秒`;

    $('rOrig').textContent = mbStr(srcFile.size);
    $('rNew').textContent = mbStr(lastBlob.size);
    $('rSave').textContent = saved > 0 ? saved + '%' : '—';

    const tag = $('saveTag');
    if (saved > 0) {
      tag.textContent = `节省 ${saved}%`;
      tag.style.display = '';
    } else {
      tag.textContent = '体积略增';
      tag.style.background = 'linear-gradient(96deg,#ffb340,#ff8a4c)';
    }

    $('result').innerHTML =
      `H.264 · ${tw} × ${th} · ${(bitrate/1e6).toFixed(1)} Mbps · AAC 128k` +
      (saved <= 0
        ? '<br><b style="color:var(--warn)">原视频已高度压缩，再压体积反而变大，建议直接用原文件。</b>'
        : '');

    const url = URL.createObjectURL(lastBlob);
    const v = $('preview');
    v.src = url;
    // 取首帧作为封面：加载元数据后跳到 0.1s 并绘制到 canvas，
    // 避免 Safari 在未播放时不渲染 video 内容导致缩略图全黑
    v.addEventListener('loadeddata', () => {
      try {
        v.currentTime = Math.min(0.1, (srcInfo.duration || 1) / 4);
      } catch (e) {}
    }, { once: true });
    v.addEventListener('seeked', () => {
      try {
        const c = document.createElement('canvas');
        c.width = 184; c.height = 184;
        const ctx = c.getContext('2d');
        // cover 裁切，保持竖屏视频不拉伸
        const vw = v.videoWidth, vh = v.videoHeight;
        const s = Math.max(c.width / vw, c.height / vh);
        const dw = vw * s, dh = vh * s;
        ctx.drawImage(v, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
        const img = new Image();
        img.src = c.toDataURL('image/jpeg', 0.82);
        img.alt = '';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
        v.style.display = 'none';
        v.parentNode.insertBefore(img, v);
        img.classList.add('thumbImg');
      } catch (e) { /* 跨域/解码失败时保持黑底 + 播放按钮 */ }
    }, { once: true });

    showCard('resultCard');
  } catch (e) {
    console.error(e);
    $('status').className = 'status';
    $('status').style.color = 'var(--err)';
    $('status').textContent = '失败：' + (e && e.message ? e.message : String(e));
  } finally {
    btn.disabled = false;
  }
});

/* ---------- 保存 ---------- */
$('download').addEventListener('click', () => {
  if (!lastBlob) return;
  const url = URL.createObjectURL(lastBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = lastName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);

  $('saveHint').textContent = '如未自动保存，点开左侧预览长按视频，选择「存储到照片」。';
});

/* ---------- 重置 ---------- */
$('again').addEventListener('click', () => {
  srcFile = srcInfo = lastBlob = null;
  fileInput.value = '';
  const v = $('preview');
  if (v.src) URL.revokeObjectURL(v.src);
  v.src = '';
  v.style.display = '';
  const old = document.querySelector('.thumbImg');
  if (old) old.remove();
  hideCard('infoCard');
  hideCard('optCard');
  hideCard('resultCard');
  hideCard('runCard');
  $('saveHint').textContent = '';
  $('status').style.color = '';
  $('saveTag').style.background = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
