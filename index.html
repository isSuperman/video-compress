<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<title>MC作业专用</title>

<!-- 图标：Safari 优先用 SVG（透明背景，任意尺寸清晰） -->
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="mask-icon" href="./favicon.svg" color="#4f7cff">

<!-- 添加到主屏幕：以独立应用方式启动，全屏无 Safari 界面 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MC作业">
<meta name="application-name" content="MC作业">
<meta name="format-detection" content="telephone=no">
<style>
  /* ── 主题变量 ── 深色为默认，浅色在 media query 里覆盖 */
  :root{
    color-scheme: dark light;
    --bg:#05060a;
    --text:#f2f4f8;
    --dim:#8a90a3;
    --dimmer:#5b6072;
    --line:rgba(255,255,255,.09);
    --line-hi:rgba(140,200,255,.32);
    --cyan:#3fd8ff;
    --blue:#4f7cff;
    --violet:#9d6bff;
    --ok:#2ee6a8;
    --warn:#ffb340;
    --err:#ff5470;
    --glass:rgba(255,255,255,.045);
    --glass-2:rgba(255,255,255,.07);

    /* —— 语义色，浅色模式会整体替换 —— */
    --hair:rgba(255,255,255,.09);        /* 细分隔线 */
    --inset:rgba(255,255,255,.045);      /* 内嵌/卡片内小元素底 */
    --inset-2:rgba(255,255,255,.07);
    --sunken:rgba(0,0,0,.30);            /* 凹陷容器（滑块槽等） */
    --card-hi:rgba(255,255,255,.07);     /* 卡片顶部高光 */
    /* 选择区专用：深色下用淡渐变玻璃，浅色下用接近实底的白 */
    --drop-a:rgba(63,216,255,.075);
    --drop-b:rgba(157,107,255,.055);
    --drop-c:rgba(255,255,255,.022);
    --drop-sheen:rgba(255,255,255,.07);
    --drop-border:rgba(255,255,255,.13);
    --drop-outline:rgba(255,255,255,.05);
    --drop-shadow:rgba(0,0,0,.9);

    /* 控件阴影：浅色模式需显著减弱，否则在浅底上发黑 */
    --thumb-shadow:rgba(0,0,0,.55);
    --btn-glow:rgba(79,124,255,.90);
    --fill-glow:rgba(79,124,255,.65);
    --fill-edge:rgba(255,255,255,.80);
    --bar-inset:rgba(0,0,0,.40);
    --chip-glow:rgba(79,124,255,.95);
    /* 按钮：玻璃三态（就绪 / 进行中 / 不可用） */
    --act-bg:rgba(255,255,255,.07);
    --act-tint-a:rgba(63,216,255,.26);
    --act-tint-b:rgba(79,124,255,.24);
    --act-tint-c:rgba(157,107,255,.26);
    --act-border:rgba(255,255,255,.16);
    --act-border-hi:rgba(255,255,255,.30);
    --act-text:#ffffff;
    --act-text-sub:rgba(255,255,255,.60);
    --act-shadow:rgba(0,0,0,.45);
    --act-hover:rgba(255,255,255,.12);
    /* 进度条：一条细亮线 */
    --act-fill-a:#3fd8ff; --act-fill-b:#6b8cff; --act-fill-c:#a97dff;
    --act-fill-glow:rgba(91,140,255,.55);
    --act-idle-bg:rgba(255,255,255,.035);
    --act-idle-text:var(--dimmer);
    --act-idle-border:rgba(255,255,255,.06);
    --act-track-line:rgba(255,255,255,.12);
    --thumb-ring:rgba(79,124,255,.95);
    --thumb-halo:rgba(79,124,255,.16);
    --card-lo:rgba(0,0,0,.22);           /* 卡片底部阴影 */
    --shadow:rgba(0,0,0,.95);

    /* 背景光晕强度 */
    --g1:rgba(63,216,255,.20);
    --g2:rgba(157,107,255,.18);
    --g3:rgba(79,124,255,.11);
    --grid:rgba(255,255,255,.022);

    /* 标题渐变 */
    --h1-a:#ffffff; --h1-b:#d9ecff; --h1-c:#7ec8ff; --h1-d:#a98bff;
    --h1-glow:rgba(90,160,255,.30);

    --r-lg:22px;
    --r-md:16px;
    --r-sm:12px;
  }

  /* ── 浅色模式 ── */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef1f7;
      --text:#10131a;
      --dim:#4a5468;
      --dimmer:#6b7488;
      --line:rgba(16,19,26,.10);
      --line-hi:rgba(60,120,220,.30);
      --ok:#0aa96b;
      --warn:#b26a00;
      --err:#d32f4a;
      --glass:rgba(255,255,255,.72);
      --glass-2:rgba(255,255,255,.85);

      --hair:rgba(16,19,26,.09);
      --inset:rgba(16,19,26,.035);
      --inset-2:rgba(16,19,26,.055);
      --sunken:rgba(16,19,26,.06);
      --card-hi:rgba(255,255,255,.95);
      --card-lo:rgba(16,19,26,.04);
      --shadow:rgba(30,45,80,.14);

      --g1:rgba(63,180,255,.30);
      --g2:rgba(157,107,255,.24);
      --g3:rgba(79,124,255,.16);
      --grid:rgba(16,19,26,.035);

      --h1-a:#0b0d13; --h1-b:#1b3a6b; --h1-c:#2f7fd6; --h1-d:#6a4bd8;
      --h1-glow:rgba(80,140,230,.22);

      /* 浅色下选择区必须够实，否则底纹透上来会很乱 */
      --drop-a:rgba(214,232,252,.98);
      --drop-b:rgba(226,222,250,.98);
      --drop-c:rgba(252,253,255,.99);
      --drop-sheen:rgba(255,255,255,.16);
      --drop-border:rgba(96,126,175,.42);
      --drop-outline:rgba(96,126,175,.16);
      --drop-shadow:rgba(30,45,80,.12);
      --thumb-shadow:rgba(30,45,80,.18);
      --btn-glow:rgba(79,124,255,.35);
      --fill-glow:rgba(79,124,255,.22);
      --fill-edge:rgba(255,255,255,.55);
      --bar-inset:rgba(16,19,26,.08);
      --chip-glow:rgba(79,124,255,.40);
      --act-bg:rgba(255,255,255,.80);
      --act-tint-a:rgba(63,180,255,.24);
      --act-tint-b:rgba(74,114,240,.20);
      --act-tint-c:rgba(139,98,234,.24);
      --act-border:rgba(96,126,175,.42);
      --act-border-hi:rgba(255,255,255,.95);
      --act-text:#16213d;
      --act-text-sub:rgba(22,33,61,.55);
      --act-shadow:rgba(30,45,80,.14);
      --act-hover:rgba(255,255,255,.95);
      --act-fill-a:#28b8e8; --act-fill-b:#4a72f0; --act-fill-c:#8b62ea;
      --act-fill-glow:rgba(74,114,240,.35);
      --act-idle-bg:rgba(16,19,26,.035);
      --act-idle-text:var(--dimmer);
      --act-idle-border:rgba(16,19,26,.06);
      --act-track-line:rgba(16,19,26,.10);
      --thumb-ring:rgba(79,124,255,.70);
      --thumb-halo:rgba(79,124,255,.12);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 添加到主屏幕后按独立应用运行：禁用橡皮筋回弹与文字选中 */
  html{overscroll-behavior:none}
  body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:auto;user-select:auto}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0 auto;max-width:600px;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom));
    background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",sans-serif;
    letter-spacing:.005em;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;position:relative;min-height:100vh;min-height:-webkit-fill-available;
  }
  /* ── 背景光晕 ── */
  body::before{
    content:"";position:fixed;inset:-20% -20% auto -20%;height:80vh;z-index:-2;
    background:
      radial-gradient(48% 42% at 22% 8%, rgba(63,216,255,.20), transparent 68%),
      radial-gradient(46% 40% at 84% 16%, rgba(157,107,255,.18), transparent 66%),
      radial-gradient(60% 44% at 50% 46%, rgba(79,124,255,.11), transparent 70%);
    filter:blur(8px);pointer-events:none;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(72% 58% at 50% 24%, #000 0%, transparent 82%);
    -webkit-mask-image:radial-gradient(72% 58% at 50% 24%, #000 0%, transparent 82%);
  }

  /* ── 标题 ── */
  header{margin-bottom:22px;padding:2px 2px 0}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cyan);opacity:.9;margin-bottom:9px;
  }
  .eyebrow::before{
    content:"";width:5px;height:5px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px 2px rgba(63,216,255,.7);
  }
  h1{
    font-size:27px;line-height:1.16;margin:0 0 8px;font-weight:700;letter-spacing:-.025em;
    background:linear-gradient(100deg,var(--h1-a) 0%,var(--h1-b) 26%,var(--h1-c) 56%,var(--h1-d) 84%,var(--h1-d) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 22px var(--h1-glow));
  }
  .sub{color:var(--dim);font-size:13px;line-height:1.6}

  /* ── 玻璃卡片 ── */
  .card{
    position:relative;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    padding:17px;
    margin-bottom:13px;
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:
      0 1px 0 var(--inset-2) inset,
      0 -1px 0 rgba(0,0,0,.22) inset,
      0 12px 34px -20px rgba(0,0,0,.95);
  }
  /* 说明：本页刻意不使用入场动画与 backdrop-filter 动画组合。
     iOS WebView 在页面不可见/无合成时 transition 会停在初始帧，
     导致卡片永久透明。玻璃质感改为静态实现。 */

  /* ── 拖放区 ── */
  .drop{
    position:relative;overflow:hidden;
    border-width:1px;
    border-style:solid;
    border-color:var(--drop-border);
    border-radius:var(--r-lg);
    padding:34px 18px 30px;
    text-align:center;cursor:pointer;
    background:linear-gradient(168deg,var(--drop-a),var(--drop-b) 58%,var(--drop-c));
    backdrop-filter:blur(28px) saturate(170%);
    -webkit-backdrop-filter:blur(28px) saturate(170%);
    /* 外投影 + 极淡外描边（帮助浅色下轮廓更清晰），
       不再使用 inset 线条，避免出现多道横线。 */
    box-shadow:
      0 16px 40px -24px var(--drop-shadow),
      0 0 0 .5px var(--drop-outline);
    transition:transform .18s cubic-bezier(.22,.9,.28,1), border-color .2s, box-shadow .2s;
    margin-bottom:13px;
  }
  .drop::after{
    content:"";position:absolute;top:-60%;left:-30%;width:60%;height:220%;
    background:linear-gradient(105deg,transparent,var(--drop-sheen),transparent);
    transform:rotate(14deg);pointer-events:none;
    opacity:.7;
  }
  .drop:active{transform:scale(.982)}
  /* 选好文件后收起，给下方卡片让出空间。
     只动 height/opacity，避免布局跳动过大 */
  .drop.collapsed{
    display:none;
  }
  .drop.over{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(63,216,255,.4),0 0 46px -8px rgba(63,216,255,.5) inset}
  .drop .ring{
    width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 34% 28%,var(--card-hi),var(--inset));
    border:1px solid var(--card-hi);
    box-shadow:0 0 26px -6px rgba(63,216,255,.55), 0 1px 0 var(--card-hi) inset;
  }
  .drop .ring svg{width:27px;height:27px;stroke:url(#g1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .drop .t{font-size:16.5px;font-weight:620;letter-spacing:-.01em}
  .drop .hint{color:var(--dim);font-size:12.5px;margin-top:5px}
  input[type=file]{display:none}

  /* ── 标签 ── */
  .label{
    font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;
    margin-bottom:11px;font-weight:650;display:flex;align-items:center;gap:8px;
  }
  .label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* ── 分段控件 ── */
  /* ── 紧凑选项：一行一组 ── */
  .optRow{
    display:flex;align-items:center;gap:10px;
    min-height:38px;
  }
  .optRow + .optRow{margin-top:10px}
  .optKey{
    flex:0 0 auto;font-size:12.5px;color:var(--dim);
    letter-spacing:.02em;width:3.2em;
  }

  /* 分辨率：小胶囊 */
  .chips{display:flex;gap:6px;flex:1}
  .chip{
    flex:1;padding:8px 4px;border-radius:10px;
    border:1px solid var(--inset-2);
    background:var(--inset);
    color:var(--dim);font:inherit;font-size:12.5px;font-weight:550;
    cursor:pointer;text-align:center;
    transition:background .16s, color .16s, border-color .16s, box-shadow .16s;
  }
  .chips .chip.on{
    color:#fff;font-weight:650;
    background:linear-gradient(178deg,rgba(79,124,255,.92),rgba(120,92,255,.86));
    border-color:transparent;
    box-shadow:0 1px 0 rgba(255,255,255,.26) inset,0 5px 16px -8px var(--chip-glow);
  }

  /* 画质：滑杆 */
  .slideWrap{flex:1;min-width:0}
  .slideWrap input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:99px;margin:0;
    background:linear-gradient(90deg,#3fd8ff,#4f7cff 50%,#9d6bff);
    outline:none;
  }
  .slideWrap input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;
    background:#fff;
    border:2px solid var(--thumb-ring);
    box-shadow:0 2px 6px var(--thumb-shadow),0 0 0 4px var(--thumb-halo);
    cursor:pointer;
  }
  .slideWrap input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:#fff;
    border:2px solid var(--thumb-ring);cursor:pointer;
  }
  .slideMarks{
    display:flex;justify-content:space-between;
    margin-top:5px;font-size:10px;color:var(--dimmer);letter-spacing:.03em;
  }
  .qVal{
    flex:0 0 auto;width:4.4em;text-align:right;
    font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  }

  /* ── 元信息 ── */
  .meta{font-size:13px;color:var(--dim);line-height:1.8;word-break:break-word}
  .meta b{color:var(--text);font-weight:600}

  /* ── 主按钮 ── */
  button.primary{
    position:relative;overflow:hidden;
    width:100%;padding:15px;border:0;border-radius:var(--r-md);
    background:linear-gradient(96deg,#2fb8ff,#4f7cff 46%,#8f5cff);
    color:#fff;font:inherit;font-size:16px;font-weight:650;letter-spacing:.01em;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,.3) inset,
      0 10px 28px -12px var(--btn-glow),
      0 0 0 .5px rgba(120,150,255,.5);
    transition:transform .15s, filter .2s, opacity .2s;
  }
  button.primary::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.26) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .6s ease;
  }
  button.primary:active{transform:scale(.982)}
  button.primary:active::after{transform:translateX(120%)}
  button.primary:disabled{
    background:var(--inset-2);color:var(--dimmer);
    box-shadow:0 1px 0 var(--inset) inset;
    cursor:default;
  }
  button.primary:disabled::after{display:none}

  /* ── 压缩按钮：玻璃质感，进度以细线呈现 ── */
  .actBtn{
    position:relative;overflow:hidden;
    margin-top:16px;padding:15px 18px;
    border-radius:var(--r-md);cursor:pointer;
    background:
      linear-gradient(96deg, var(--act-tint-a), var(--act-tint-b) 52%, var(--act-tint-c)),
      var(--act-bg);
    border:1px solid var(--act-border);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:
      0 1px 0 var(--act-border-hi) inset,
      0 -1px 0 rgba(0,0,0,.10) inset,
      0 10px 26px -16px var(--act-shadow);
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
    -webkit-user-select:none;user-select:none;
  }
  /* 顶部高光：模拟玻璃边缘反光 */
  .actBtn::after{
    content:"";position:absolute;top:0;left:8%;right:8%;height:1px;
    background:linear-gradient(90deg,transparent,var(--act-border-hi),transparent);
    pointer-events:none;
  }
  .actBtn:active{transform:scale(.985)}
  .actBtn:active::before{
    content:"";position:absolute;inset:0;
    background:var(--act-hover);pointer-events:none;z-index:0;
  }

  /* 进度：底部一条细亮线，长度即进度 */
  .actFill{
    position:absolute;left:0;right:auto;bottom:0;top:auto;
    height:2px;width:0;
    background:linear-gradient(90deg,var(--act-fill-a),var(--act-fill-b) 48%,var(--act-fill-c));
    box-shadow:0 0 10px var(--act-fill-glow);
    border-radius:0 2px 0 0;
    pointer-events:none;
    z-index:1;
  }

  .actRow{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .actLabel{
    font-size:16px;font-weight:650;color:var(--act-text);
    letter-spacing:.01em;font-variant-numeric:tabular-nums;
  }
  .actPct{
    font-size:13px;font-weight:600;color:var(--act-text-sub);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .actPct:empty{display:none}

  /* 进行中：玻璃变亮一点，进度线显形 */
  .actBtn.busy{
    background:
      linear-gradient(96deg, var(--act-tint-a), var(--act-tint-b) 52%, var(--act-tint-c)),
      var(--act-bg);
    border-color:var(--act-border);
    cursor:default;
  }
  /* 进行中：底部先铺一条淡轨道，进度线在其上推进 */
  .actBtn.busy::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:var(--act-track-line);
    z-index:0;
  }
  .actBtn.busy:active{transform:none}
  .actBtn.busy:active::before{display:none}

  /* 不可用 */
  .actBtn.disabled{
    background:var(--act-idle-bg);
    border-color:var(--act-idle-border);
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
    cursor:default;pointer-events:none;
  }
  .actBtn.disabled .actLabel,
  .actBtn.disabled .actPct{color:var(--act-idle-text)}
  .actBtn.disabled::after{opacity:.3}
  .actBtn.disabled:active{transform:none}

  /* 次要操作：文字链样式，刻意做小并与主按钮拉开距离，避免误触 */
  .linkBtn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin:18px auto 2px;padding:8px 14px;
    border:0;background:transparent;
    color:var(--dimmer);font:inherit;font-size:13px;
    cursor:pointer;border-radius:10px;
    transition:color .15s, background .15s;
  }
  .linkBtn svg{
    width:14px;height:14px;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    opacity:.8;
  }
  .linkBtn:active{color:var(--dim);background:var(--inset)}

  /* ── 进度 ── */
  .bar{
    height:5px;border-radius:99px;overflow:hidden;margin:14px 0 10px;
    background:var(--inset-2);
    box-shadow:0 1px 2px var(--bar-inset) inset;
  }
  .bar>i{
    display:block;height:100%;width:0;border-radius:99px;

  .status{

  /* ── 结果 ── */
  .divider{

  .resTop{

    display:inline-flex;align-items:center;gap:5px;

  .row{display:flex;gap:8px}
  .row>div{
    flex:1;padding:11px 6px;border-radius:13px;text-align:center;
    background:var(--inset);
    border:1px solid var(--inset-2);
    font-size:10.5px;color:var(--dim);letter-spacing:.04em;

  .row b{
    display:block;font-size:16.5px;font-weight:680;color:var(--text);
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:2px;

  .row .new{

  .row .new b{color:var(--ok)}
  .spec{
    font-size:11.5px;color:var(--dim);line-height:1.65;margin-top:11px;

  .note{font-size:12.5px;color:var(--warn);margin-top:11px;line-height:1.6}

  .save{font-size:11.5px;color:var(--dimmer);text-align:center;margin-top:9px;line-height:1.6}

  /* 折叠过渡：仅 JS 添加 .collapsing 时生效 */
  .card.collapsing{
    transition: height .28s cubic-bezier(.4,0,.2,1),
                margin-bottom .28s cubic-bezier(.4,0,.2,1),

  .hide{display:none!important}

  footer{
    text-align:center;font-size:11px;color:var(--dimmer);

  footer b{color:var(--dim);font-weight:600}
  .ver{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:14px;padding:5px 12px;border-radius:99px;
    background:var(--inset);
    border:1px solid var(--inset-2);
    font-size:10.5px;letter-spacing:.03em;color:var(--dimmer);
    font-variant-numeric:tabular-nums;cursor:pointer;
    transition:background .15s;

  /* ── 署名 ── */
  .sign{
    display:flex;align-items:center;justify-content:center;gap:11px;
    margin-top:20px;letter-spacing:.04em;
  }
  .signLine{
    flex:0 1 42px;height:1px;
    background:linear-gradient(90deg,transparent,var(--card-hi));
  }
  .signLine:last-child{
    background:linear-gradient(90deg,var(--card-hi),transparent);
  }
  .signText{
    font-size:11px;color:var(--dimmer);white-space:nowrap;
    letter-spacing:.05em;
  }
  .signText b{
    color:var(--text);font-weight:650;letter-spacing:.03em;
    background:linear-gradient(96deg,#7ec8ff,#a98bff);
    -webkit-background-clip:text;background-clip:text;

  }
  .heart{
    color:#ff5f7a;font-size:10.5px;
    filter:drop-shadow(0 0 6px rgba(255,95,122,.55));
    display:inline-block;transform:translateY(-.5px);
  }
  .ver:active{background:var(--hair)}
  .verDot{
    width:5px;height:5px;border-radius:50%;background:var(--dimmer);
    box-shadow:0 0 7px 1px rgba(138,144,163,.5);flex:0 0 auto;
  }
  .ver.ok{color:var(--dim);border-color:rgba(46,230,168,.22)}
  .ver.ok .verDot{background:var(--ok);box-shadow:0 0 8px 1.5px rgba(46,230,168,.65)}
  .ver.stale{color:var(--warn);border-color:rgba(255,179,64,.3)}
  .ver.stale .verDot{background:var(--warn);box-shadow:0 0 8px 1.5px rgba(255,179,64,.65)}
  .ver.err{color:var(--err);border-color:rgba(255,84,112,.28)}
  .ver.err .verDot{background:var(--err);box-shadow:0 0 8px 1.5px rgba(255,84,112,.6)}

  /* ── 全屏预览浮层 ── */
  .viewer{
    position:fixed;top:0;left:0;right:0;bottom:0;
    width:100%;height:100%;z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;

  .viewer video{

  .viewerClose{
    position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--card-hi);
    background:var(--inset-2);color:#fff;
    font-size:15px;line-height:1;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .viewerBar{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:11px 14px;border-radius:14px;
    background:var(--inset-2);
    border:1px solid var(--hair);
  }
  .viewerName{
    flex:1;min-width:0;font-size:12px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;

    background:linear-gradient(96deg,#2fb8ff,#4f7cff 46%,#8f5cff);
    color:#fff;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 8px 20px -10px var(--btn-glow);
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fd8ff"/>
      <stop offset="55%" stop-color="#6f8cff"/>
      <stop offset="100%" stop-color="#c39bff"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <div class="eyebrow">WebCodecs · Local</div>
  <h1>MC作业专用</h1>
  <div class="sub">本地硬件编码，文件不会上传到任何服务器</div>
</header>

<div class="drop" id="drop">
  <div class="ring">
    <svg viewBox="0 0 24 24">
      <rect x="2.5" y="6" width="13" height="12" rx="2.6"/>
      <path d="M15.5 11.2l5-2.9v7.4l-5-2.9z"/>
    </svg>
  </div>
  <div class="t">选择视频</div>
  <div class="hint">或把文件拖进来 · MP4 / MOV / WebM</div>
  <input type="file" id="file" accept="video/*">
</div>

<div class="card hide" id="infoCard">
  <div class="label">源文件</div>
  <div class="meta" id="meta"></div>
  <div class="note" id="srcWarn"></div>

  <div class="divider"></div>

  <div class="optRow">
    <span class="optKey">分辨率</span>
    <div class="chips" id="resOpts">
      <button class="chip on" data-res="1080">1080p</button>
      <button class="chip" data-res="720">720p</button>
      <button class="chip" data-res="480">480p</button>
    </div>
  </div>

  <div class="optRow">
    <span class="optKey">画质</span>
    <div class="slideWrap">
      <input type="range" id="qRange" min="0" max="2" step="1" value="1"
             aria-label="画质档位">
      <div class="slideMarks">
        <span>小</span><span>标准</span><span>高</span>
      </div>
    </div>
    <span class="qVal" id="qVal">4 Mbps</span>
  </div>

  <div class="note" id="codecWarn"></div>

  <!-- 压缩按钮 + 进度：同一个容器内，进度沿按钮底边推进 -->
  <div class="actBtn" id="start" role="button" tabindex="0">
    <div class="actFill" id="bar"></div>
    <div class="actRow">
      <span class="actLabel" id="actLabel">开始压缩</span>
      <span class="actPct" id="actPct"></span>
    </div>
  </div>
  <div class="hide" id="status"></div>
</div>

<div class="card hide" id="resultCard">
  <div class="label">压缩完成</div>
  <div class="resTop">
    <span class="saveTag" id="saveTag">已压缩</span>
    <span class="resTime" id="rTime"></span>
  </div>
  <div class="row">
    <div><b id="rOrig">—</b>原始</div>
    <div class="new"><b id="rNew">—</b>压缩后</div>
    <div><b id="rSave">—</b>节省</div>
  </div>
  <div class="spec" id="result"></div>
  <button class="primary" id="download" style="margin-top:14px">保存到相册</button>
  <div class="save" id="saveHint"></div>
  <button class="linkBtn" id="again">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 12a8 8 0 1 0 2.4-5.7"/>
      <path d="M4 5v4.5h4.5"/>
    </svg>
    处理另一个视频
  </button>
</div>

<footer>
  基于 <b>mediabunny</b> + <b>WebCodecs</b><br>
  需要 iOS 16.4+ / Chrome 94+ 等支持 WebCodecs 的浏览器

  <div class="sign">
    <span class="signLine"></span>
    <span class="signText">Crafted with <span class="heart">♥</span> by <b>MC'dady</b></span>
    <span class="signLine"></span>
  </div>

  <div class="ver" id="verLine">
    <span class="verDot" id="verDot"></span>
    <span id="verText">检查版本中…</span>
  </div>
</footer>

<script src="./lib/mediabunny.bundle.js"></script>
<script>
const mb = window.Mediabunny;
const $ = id => document.getElementById(id);

let srcFile = null, srcInfo = null, lastBlob = null, lastName = '';
let selRes = 1080, selQ = 4;

/* ---------- 版本号 ---------- */
// 读取 version.json（构建时由 build.sh 生成）。
// 顺便对比缓存版本：如果服务器版本比当前页面新，说明有未刷新的更新。
const APP_VERSION = (() => {
  const el = document.getElementById('verText');
  const box = document.getElementById('verLine');
  let current = null;

  async function fetchVersion(bust) {
    const url = './version.json' + (bust ? '?t=' + Date.now() : '');
    const r = await fetch(url, bust ? { cache: 'no-store' } : undefined);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // 若站点没有 version.json，Pages 会回退返回 index.html，
    // 这里按 content-type 判断，避免把 HTML 当 JSON 解析后报错
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('json')) throw new Error('NO_VERSION_FILE');
    return r.json();
  }

  async function init() {
    try {
      const v = await fetchVersion(false);
      current = v;
      const when = fmtBuildTime(v.builtAt);
      el.textContent = [v.version, when].filter(Boolean).join(' · ');
      box.className = 'ver ok';
      box.title = '点击检查更新';
    } catch (e) {
      el.textContent = e.message === 'NO_VERSION_FILE' ? '未部署版本文件' : '版本未知';
      box.className = 'ver err';
    }
  }

  // 构建时间格式化为本地时间（MM/DD HH:mm）
  function fmtBuildTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // 点击手动检查更新
  box.addEventListener('click', async () => {
    el.textContent = '检查中…';
    box.className = 'ver';
    try {
      const v = await fetchVersion(true);
      if (current && v.version !== current.version) {
        el.textContent = `有新版本 ${v.version} · 点击刷新`;
        box.className = 'ver stale';
        box.onclick = () => location.reload(true);
        return;
      }
      el.textContent = `${v.version} · 已是最新`;
      box.className = 'ver ok';
    } catch (e) {
      el.textContent = '连接失败';
      box.className = 'ver err';
    }
  });

  init();
  return { get current() { return current; } };
})();

/* ---------- 卡片显示 ---------- */
// 不使用 opacity 过渡（见 CSS 注释），直接切换显隐，保证任何环境下都可见。
// 卡片显隐。
// 不能用 opacity 过渡：本环境（iOS WebView）里 transition 常卡在初始帧。
// 改为固定高度 + 透明度，用 Web Animations API 播放，结束时再落到最终态，
// 即使动画不推进也能正确收尾（finish 会强制跳到末帧）。
function showCard(id){
  const el = $(id);
  el.classList.remove('hide');
  el.classList.remove('enter');

  // 入场：与折叠同思路，用定时器分步写样式，保证在本环境也能看到效果。
  const STEPS = 7;
  const DUR = 240;
  let i = 0;
  el.style.opacity = '0';
  el.style.transform = 'translateY(8px)';

  const tick = () => {
    i++;
    const t = i / STEPS;
    const e = 1 - Math.pow(1 - t, 3);
    el.style.opacity = String(e);
    el.style.transform = `translateY(${(8 * (1 - e)).toFixed(2)}px)`;
    if (i < STEPS) {
      setTimeout(tick, DUR / STEPS);
    } else {
      el.style.opacity = '';
      el.style.transform = '';
    }
  };
  setTimeout(tick, DUR / STEPS);
}

function hideCard(id, animate = true, onDone){
  const el = $(id);
  const finish = () => { if (typeof onDone === 'function') onDone(); };
  if (!animate || el.classList.contains('hide')) {
    el.classList.add('hide');
    finish();
    return;
  }

  // 折叠：分步改高度。
  // 本环境的 rAF / Web Animations / CSS transition 都可能不推进（合成器时间冻结），
  // 因此这里用定时器逐帧写样式，只要 JS 计时器在跑就一定能平滑收起。
  const h = el.offsetHeight;
  const mb = parseFloat(getComputedStyle(el).marginBottom) || 0;
  const STEPS = 7;
  const DUR = 210;

  el.style.overflow = 'hidden';
  el.classList.add('collapsing');

  let i = 0;
  const tick = () => {
    i++;
    const t = i / STEPS;
    // ease-out：起步快、收尾缓
    const e = 1 - Math.pow(1 - t, 3);
    el.style.height = Math.round(h * (1 - e)) + 'px';
    el.style.marginBottom = Math.round(mb * (1 - e)) + 'px';
    el.style.opacity = String(1 - e * 0.9);

    if (i < STEPS) {
      setTimeout(tick, DUR / STEPS);
    } else {
      el.classList.remove('collapsing');
      el.classList.add('hide');
      el.style.height = '';
      el.style.marginBottom = '';
      el.style.overflow = '';
      el.style.opacity = '';
      finish();
    }
  };
  el.style.height = h + 'px';
  el.style.marginBottom = mb + 'px';
  setTimeout(tick, DUR / STEPS);
}
// 进度区不是 .card，单独显隐
// 一体化按钮的三种状态：可用 / 进行中 / 不可用
function setBtnState(state, label) {
  const b = $('start');
  b.classList.toggle('disabled', state === 'disabled');
  b.classList.toggle('busy', state === 'busy');
  if (label != null) $('actLabel').textContent = label;
  if (state === 'idle') {
    $('bar').style.width = '0%';
    $('actPct').textContent = '';
  }
}

/* ---------- 环境检测 ---------- */
const HAS_WC = typeof VideoEncoder !== 'undefined' && typeof VideoDecoder !== 'undefined';

/* ---------- 文件选择 ---------- */
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
});

function fmtTime(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function mbStr(bytes) {
  return (bytes/1048576).toFixed(bytes > 10485760 ? 1 : 2) + ' MB';
}

async function loadFile(f) {
  srcFile = f;
  // 选中文件后收起选择区，避免占着屏幕第一屏
  $('drop').classList.add('collapsed');
  lastBlob = null;
  hideCard('resultCard');
  setBtnState('disabled', '开始压缩');
  $('status').textContent = '';
  $('status').className = 'status';
  $('srcWarn').textContent = '';
  $('codecWarn').textContent = '';
  setBtnState('disabled');

  if (!HAS_WC) {
    $('meta').textContent = '';
    showCard('infoCard');
    $('srcWarn').textContent =
      '当前浏览器不支持 WebCodecs，无法进行硬件编码。请使用 Safari（iOS 16.4+）或其他新版浏览器打开。';
    $('drop').classList.remove('collapsed');
    return;
  }

  try {
    const input = new mb.Input({
      formats: mb.ALL_FORMATS,
      source: new mb.BlobSource(f)
    });
    const vTrack = await input.getPrimaryVideoTrack();
    const aTrack = await input.getPrimaryAudioTrack();

    if (!vTrack) throw new Error('文件中没有找到视频轨道');

    srcInfo = {
      input, vTrack, aTrack,
      width: vTrack.displayWidth || vTrack.codedWidth,
      height: vTrack.displayHeight || vTrack.codedHeight,
      duration: await input.computeDuration(),
      hasAudio: !!aTrack,
      codec: vTrack.codec
    };

    // mediabunny 的 displayWidth / displayHeight 已经应用了旋转矩阵
    // （例如 iPhone 竖屏视频：coded 1920×1080 + rotation 90 → display 1080×1920），
    // 所以直接用 display 尺寸，不需要自己再对调，否则方向反而会错。
    srcInfo.displayW = srcInfo.width;
    srcInfo.displayH = srcInfo.height;

    $('meta').innerHTML =
      `<b>${f.name}</b><br>` +
      `${srcInfo.displayW} × ${srcInfo.displayH} · ${fmtTime(srcInfo.duration)} · ${mbStr(f.size)}<br>` +
      `编码 <b>${String(srcInfo.codec || '未知').toUpperCase()}</b>` +
      (srcInfo.hasAudio ? ' · 含音轨' : ' · <b>无音轨</b>');

    showCard('infoCard');

    if (!srcInfo.hasAudio) {
      $('srcWarn').textContent = '该视频没有音轨，压缩后的文件也不会有声音。';
    }

    // 预检：确认源编码可解码
    const testOutput = new mb.Output({
      format: new mb.Mp4OutputFormat(),
      target: new mb.BufferTarget()
    });
    const probe = await mb.Conversion.init({
      input, output: testOutput,
      video: { codec: 'avc', bitrate: 2500000 },
      audio: srcInfo.hasAudio
        ? { codec: 'aac', bitrate: 128000 }
        : { discard: true }
    });
    const dropped = (probe.discardedTracks || [])
      .filter(t => t.reason !== 'discarded_by_user');
    if (!probe.isValid || dropped.length) {
      const why = dropped.map(t => t.reason).join(', ') || '配置无效';
      $('srcWarn').textContent =
        `此视频的编码（${String(srcInfo.codec).toUpperCase()}）无法被浏览器直接解码（${why}）。` +
        `请换用手机原始拍摄的视频，或先用其他工具转成 H.264 / HEVC 再试。`;
      return;
    }

    setBtnState('idle', '开始压缩');
  } catch (e) {
    console.error(e);
    $('meta').textContent = '';
    showCard('infoCard');
    $('srcWarn').textContent = '读取失败：' + e.message;
    $('drop').classList.remove('collapsed');
  }
}

/* ---------- 选项 ---------- */
// 分辨率：胶囊按钮
$('resOpts').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  [...$('resOpts').children].forEach(x => x.classList.remove('on'));
  b.classList.add('on'); selRes = +b.dataset.res;
});

// 画质：滑杆，0=小(2Mbps) 1=标准(4Mbps) 2=高(8Mbps)
const Q_LEVELS = [
  { q: 2, label: '2 Mbps' },
  { q: 4, label: '4 Mbps' },
  { q: 8, label: '8 Mbps' }
];
$('qRange').addEventListener('input', e => {
  const lv = Q_LEVELS[+e.target.value] || Q_LEVELS[1];
  selQ = lv.q;
  $('qVal').textContent = lv.label;
});

/* ---------- 计算目标尺寸 ---------- */
// displayW/H 已带旋转（竖屏是 1080×1920），但 mediabunny 的 width/height 参数
// 作用于 coded 尺寸，所以这里按 coded 尺寸比例缩放，再按显示方向返回。
function targetSize(w, h, maxDim) {
  const longSide = Math.max(w, h);
  const scale = Math.min(1, maxDim / longSide);
  return [
    Math.max(2, Math.round(w * scale / 2) * 2),
    Math.max(2, Math.round(h * scale / 2) * 2)
  ];
}

/* ---------- 开始压缩 ---------- */
$('start').addEventListener('click', startConvert);
// div 模拟按钮，补上键盘触发
$('start').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    $('start').click();
  }
});

async function startConvert() {
  if (!srcFile || !srcInfo || $('start').classList.contains('disabled')) return;

  setBtnState('busy', '准备中');
  $('bar').style.width = '0%';
  $('status').className = 'status';
  $('status').textContent = '';

  try {
    // 缩放基准用「短边」判断清晰度档位：1080p 指短边 1080。
    // 竖屏 1080×1920 与横屏 1920×1080 都应落在 1080p 档，不被缩小。
    const shortSide = Math.min(srcInfo.displayW, srcInfo.displayH);
    const scale = Math.min(1, selRes / shortSide);
    const tw = Math.max(2, Math.round(srcInfo.displayW * scale / 2) * 2);
    const th = Math.max(2, Math.round(srcInfo.displayH * scale / 2) * 2);

    // 码率按实际像素数缩放（以 1080p 为基准）
    const ratio = Math.max(0.3, (tw * th) / (1920 * 1080));
    const bitrate = Math.round(selQ * 1e6 * ratio);

    const output = new mb.Output({
      format: new mb.Mp4OutputFormat(),
      target: new mb.BufferTarget()
    });

    const conversion = await mb.Conversion.init({
      input: srcInfo.input,
      output,
      video: {
        width: tw, height: th,
        fit: 'contain',
        codec: 'avc',
        bitrate,
        keyFrameInterval: 2,
        // 关键：allowRotationMetadata 让 mediabunny 用旋转标记表达方向，
        // 而不是把像素转置。否则竖屏视频会被压成横屏或尺寸错乱。
        allowRotationMetadata: true,
        hardwareAcceleration: 'prefer-hardware'
      },
      audio: srcInfo.hasAudio
        ? { codec: 'aac', bitrate: 128000, numberOfChannels: 2, sampleRate: 48000 }
        : { discard: true }
    });

    if (!conversion.isValid) {
      const why = (conversion.discardedTracks || []).map(t => t.reason).join(', ');
      throw new Error('无法配置此转换：' + (why || '未知原因'));
    }

    conversion.onProgress = p => {
      const pct = Math.min(100, Math.round(p * 100));
      $('bar').style.width = pct + '%';
      $('actLabel').textContent = '压缩中';
      $('actPct').textContent = pct + '%';
    };

    const t0 = performance.now();
    await conversion.execute();
    const elapsed = (performance.now() - t0) / 1000;

    const buf = output.target.buffer;
    if (!buf || !buf.byteLength) throw new Error('输出为空，编码可能失败');

    lastBlob = new Blob([buf], { type: 'video/mp4' });
    lastName = srcFile.name.replace(/\.[^.]+$/, '') + '_compressed.mp4';

    const saved = Math.round((1 - lastBlob.size / srcFile.size) * 100);

    // 完成后整张源文件卡（含压缩按钮与输出设置）收起，只留结果卡
    $('status').textContent = '';

    $('rOrig').textContent = mbStr(srcFile.size);
    $('rNew').textContent = mbStr(lastBlob.size);
    $('rSave').textContent = saved > 0 ? saved + '%' : '—';

    const tag = $('saveTag');
    if (saved > 0) {
      tag.textContent = `节省 ${saved}%`;
      tag.style.display = '';
    } else {
      tag.textContent = '体积略增';
      tag.style.background = 'linear-gradient(96deg,#ffb340,#ff8a4c)';
    }

    $('result').innerHTML =
      `H.264 · ${tw} × ${th} · ${(bitrate/1e6).toFixed(1)} Mbps · AAC 128k` +
      (saved <= 0
        ? '<br><b style="color:var(--warn)">原视频已高度压缩，再压体积反而变大，建议直接用原文件。</b>'
        : '');

    // 耗时放在成果栏
    $('rTime').textContent = `用时 ${elapsed.toFixed(1)} 秒`;
    $('status').textContent = '';

    // 交接改为串行：先把源文件卡折叠收起，腾出空间后再展开结果卡。
    // 两件事同时做会让布局连跳两次，看起来生硬。
    // 注意：本环境 requestAnimationFrame 不触发，只能用定时器。
    hideCard('infoCard', true, () => {
      showCard('resultCard');
      setTimeout(() => {
        try {
          $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch (e) {}
      }, 160);
    });
  } catch (e) {
    console.error(e);
    setBtnState('idle', '重新压缩');
    $('status').className = 'status';
    $('status').style.color = 'var(--err)';
    $('status').classList.remove('hide');
    $('status').textContent = '失败：' + (e && e.message ? e.message : String(e));
  } finally {
    // 失败时按钮要回到可点状态；成功时卡片已隐藏，无需处理
    const b = $('start');
    if (b.classList.contains('busy')) {
      setBtnState('idle', '开始压缩');
    }
  }
}

/* ---------- 保存 ---------- */
// iOS Safari 不允许网页直接写入相册，唯一合法途径是系统分享面板里的「存储到照片」。
// 因此优先调用 Web Share API 直接唤起分享面板，用户一步就能存进相册。
function saveFile() {
  if (!lastBlob) return;
  const file = new File([lastBlob], lastName, { type: 'video/mp4' });

  // 支持分享文件时，直接弹出系统面板（含「存储到照片」）
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({
      files: [file],
      title: lastName
    }).then(() => {
      $('saveHint').textContent = '已保存。若没看到视频，请到相册的「最近项目」查看。';
    }).catch(err => {
      // 用户取消不提示
      if (err && err.name === 'AbortError') return;
      downloadFallback();
    });
    return;
  }

  downloadFallback();
}

// 兜底：走浏览器下载（存到「文件」App）
function downloadFallback() {
  const url = URL.createObjectURL(lastBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = lastName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);

  $('saveHint').textContent =
    '当前浏览器不支持直接分享。文件已下载到「文件」App，可在相册里用「导入」加入照片。';
}

$('download').addEventListener('click', saveFile);

/* ---------- 重置 ---------- */
$('again').addEventListener('click', () => {
  srcFile = srcInfo = lastBlob = null;
  fileInput.value = '';
  hideCard('infoCard');
  hideCard('resultCard');
  $('drop').classList.remove('collapsed');
  $('saveHint').textContent = '';
  $('rTime').textContent = '';
  $('status').style.color = '';
  $('saveTag').style.background = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
